name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The integration suite starts a real SQL Server through Testcontainers, so the runner needs Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json is the only place the SDK version is written down.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore UnifiedInbox.sln

      # Warnings are errors in CI only. Locally they are noise you can see; here nobody is watching the
      # build scroll by, so a new warning has to be a deliberate decision.
      - name: Build
        run: dotnet build UnifiedInbox.sln -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test UnifiedInbox.sln
          -c Release
          --no-build
          --logger "trx;LogFilePrefix=ci"
          --results-directory ${{ runner.temp }}/TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults/**/*.trx
          if-no-files-found: warn
